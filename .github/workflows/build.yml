name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:    { required: true,  default: 'release' }
      project_type:  { required: true,  default: 'auto' }   # auto|flutter|gradle
      source_url:    { required: true }                      # URL zip dari GH release
      attempt:       { required: false, default: '0' }

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # kalau project_type=flutter -> pakai flutter-version
        # kalau gradle -> pakai java-version + gradle-version
        include:
          - { java: '17', flutter: '3.22.0', gradle: '8.4' }
          - { java: '11', flutter: '3.16.9', gradle: '7.6'  }
          - { java: '17', flutter: '3.19.0', gradle: '8.0'  }
          - { java: '8',  flutter: '3.13.0', gradle: '6.7'  }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source
        run: |
          curl -L "${{ inputs.source_url }}" -o src.zip
          mkdir -p project
          unzip -q src.zip -d project || (cd project && unzip -q ../src.zip && rm ../src.zip)

      - name: Detect project type
        id: detect
        run: |
          if find project -maxdepth 3 -name "pubspec.yaml" | grep -q .; then
            echo "type=flutter" >> $GITHUB_OUTPUT
          else
            echo "type=gradle" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: 'stable'

      - name: Auto-fix common errors
        run: |
          cd project
          if [ -f pubspec.yaml ]; then
            flutter pub get || true
            # fix: minSdkVersion terlalu rendah
            find android -name "build.gradle" -exec sed -i 's/minSdkVersion .*/minSdkVersion 21/' {} + || true
          fi
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        run: |
          cd project
          if [ "${{ inputs.build_type }}" = "release" ]; then
            flutter build apk --release || flutter build apk
          else
            flutter build apk --debug
          fi
          find build -name "*.apk" -exec cp {} ../output.apk \;

      - name: Build Gradle APK
        if: steps.detect.outputs.type == 'gradle'
        run: |
          cd project
          GRADLE_VER=${{ matrix.gradle }}
          if [ ! -f gradlew ]; then
            wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip
            unzip -q gradle-${GRADLE_VER}-bin.zip
            export PATH=$PWD/gradle-${GRADLE_VER}/bin:$PATH
          fi
          if [ "${{ inputs.build_type }}" = "release" ]; then
            (./gradlew assembleRelease || gradle assembleRelease)
          else
            (./gradlew assembleDebug || gradle assembleDebug)
          fi
          find . -name "*.apk" -exec cp {} ../output.apk \;

      - name: Upload APK
        if: hashFiles('output.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-java${{ matrix.java }}-fl${{ matrix.flutter }}-gr${{ matrix.gradle }}
          path: output.apk
