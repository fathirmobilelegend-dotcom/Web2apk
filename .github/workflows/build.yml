name: Flutter Auto Build Bot

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe Build (build_web, build_flutter_release, build_flutter_debug)'
        required: true
      zip_url:
        description: 'Link URL Zip source code'
        required: true
      chat_id:
        description: 'ID Telegram User untuk mengirim hasil'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Send Start Notification to Telegram
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage -d chat_id="${{ github.event.inputs.chat_id }}" -d text="⚙️ Sistem GitHub menerima request. Sedang mendownload dan menyiapkan environment..."

      - name: Download & Extract Source Code
        run: |
          mkdir project
          cd project
          wget -qO source.zip "${{ github.event.inputs.zip_url }}"
          unzip -q source.zip
          # Pindah ke direktori utama jika di dalam zip ada folder root
          DIR_NAME=$(ls -d */ | head -n 1)
          if [ ! -z "$DIR_NAME" ]; then
            mv $DIR_NAME* .
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: |
          cd project
          flutter pub get

      - name: Build Web
        if: ${{ github.event.inputs.build_type == 'build_web' }}
        run: |
          cd project
          flutter build web || (echo "Build Gagal" && exit 1)
          cd build/web
          zip -r ../../web_build.zip .

      - name: Build Flutter APK (Release)
        if: ${{ github.event.inputs.build_type == 'build_flutter_release' }}
        run: |
          cd project
          flutter build apk --release || (echo "Build Gagal" && exit 1)
          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - name: Build Flutter APK (Debug)
        if: ${{ github.event.inputs.build_type == 'build_flutter_debug' }}
        run: |
          cd project
          flutter build apk --debug || (echo "Build Gagal" && exit 1)
          cp build/app/outputs/flutter-apk/app-debug.apk ../app-debug.apk

      - name: Send Artifacts to Telegram (Success)
        if: success()
        run: |
          # Untuk file kecil, bisa langsung upload. 
          # Namun jika APK besar (di atas 50MB via curl), lebih baik di-upload ke layanan transfer sementara
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" -d chat_id="${{ github.event.inputs.chat_id }}" -d text="✅ Build Berhasil! Silahkan cek Actions / Artifacts di Repo GitHub (Atau konfigurasi upload file API jika dibutuhkan)."
          
      - name: Send Error Log to Telegram (On Failure)
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage -d chat_id="${{ github.event.inputs.chat_id }}" -d text="❌ BUILD GAGAL! Terjadi kesalahan pada source code atau dependensi. Silahkan cek syntax kode Anda."
