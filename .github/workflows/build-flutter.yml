name: Build Flutter APK (Fallback Worker)

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Prepare and Build
        run: |
          # 1. Pastikan jq terinstal untuk parsing JSON
          sudo apt-get update && sudo apt-get install -y jq

          # 2. Ambil URL dari payload
          URL=$(echo '${{ github.event.inputs.payload }}' | jq -r '.url')
          
          if [ "$URL" != "null" ] && [ -n "$URL" ]; then
            echo "Mengunduh source code dari $URL"
            wget -O project.zip "$URL"
            unzip -q project.zip -d project
          else
            echo "Error: URL tidak ditemukan di payload!"
            exit 1
          fi

          # 3. Cari folder asli yang berisi pubspec.yaml
          PROJECT_DIR=$(find project -name "pubspec.yaml" -maxdepth 3 -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: File pubspec.yaml tidak ditemukan di dalam zip!"
            exit 1
          fi

          echo "Pindah ke direktori: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 4. Mulai proses Build
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          # Gunakan wildcard (**) agar tetap ketemu meskipun berada di dalam sub-folder
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
