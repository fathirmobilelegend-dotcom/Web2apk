name: Build Flutter APK
on:
  workflow_dispatch:
    inputs:
      chat_id:
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter_version: ['3.10.6', '3.13.9', '3.19.6', '3.22.2', '3.24.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_version }}
          channel: 'stable'
      - name: Build APK
        id: build
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --verbose 2>&1 | tee build.log
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then echo "SUCCESS=true" >> $GITHUB_OUTPUT; else echo "SUCCESS=false" >> $GITHUB_OUTPUT; exit 1; fi
      - name: Send APK to Telegram
        if: steps.build.outputs.SUCCESS == 'true'
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SIZE=$(stat -c%s "$APK")
          echo "APK Size: $SIZE bytes"
          curl -s -X POST https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage -d chat_id=${{ inputs.chat_id }} -d text="✅ BERHASIL BUILD di Flutter v${{ matrix.flutter_version }}. Lagi ngirim APK nya ($((SIZE/1024/1024))MB)..."
          curl -s -X POST https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendDocument -F chat_id=${{ inputs.chat_id }} -F document=@"$APK" -F caption="✅ APK Jadi! Flutter v${{ matrix.flutter_version }}. File: app-release.apk"
      - name: Send Fail Log
        if: failure()
        run: |
          tail -n 80 build.log | tail -c 3500 > err.txt
          MSG=$(cat err.txt)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage -d chat_id=${{ inputs.chat_id }} -d text="❌ GAGAL di Flutter v${{ matrix.flutter_version }}. Error Log:
          $MSG"
